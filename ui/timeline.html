<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Payment Incident Investigator</title>
  <style>
    :root {
      --paper: #f7f7f4;
      --surface: #ffffff;
      --ink: #191c20;
      --muted: #687078;
      --line: #d8dcdf;
      --red: #d83a3a;
      --red-soft: #fff0ef;
      --green: #087a55;
      --green-soft: #eaf8f1;
      --blue: #1769aa;
      --blue-soft: #eaf3fb;
      --amber: #a55b00;
      --amber-soft: #fff4de;
      --purple: #7251a6;
      --shadow: 0 10px 30px rgba(25, 28, 32, .08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 14px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }
    button, select { font: inherit; }
    header {
      background: #181a1d;
      color: #fff;
      padding: 22px clamp(18px, 4vw, 56px) 20px;
      border-bottom: 4px solid var(--red);
    }
    .brand-row {
      max-width: 1480px;
      margin: 0 auto;
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
    }
    .brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
    .brand-mark {
      width: 38px; height: 38px; border-radius: 6px;
      display: grid; place-items: center;
      background: var(--red); font-weight: 850; font-size: 20px;
      flex: 0 0 auto;
    }
    h1 { margin: 0; font-size: clamp(20px, 3vw, 30px); line-height: 1.1; font-weight: 780; }
    .track { margin-top: 5px; color: #bfc5ca; font-size: 12px; text-transform: uppercase; font-weight: 700; }
    .live { display: flex; align-items: center; gap: 8px; color: #dbe0e4; white-space: nowrap; }
    .live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #39c887; box-shadow: 0 0 0 4px rgba(57,200,135,.15); }
    main { max-width: 1480px; margin: 0 auto; padding: 22px clamp(18px, 4vw, 56px) 48px; }
    .metrics {
      display: grid; grid-template-columns: repeat(5, minmax(130px, 1fr));
      background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
    }
    .metric { padding: 16px 18px; border-right: 1px solid var(--line); min-width: 0; }
    .metric:last-child { border-right: 0; }
    .metric-label { color: var(--muted); text-transform: uppercase; font-size: 11px; font-weight: 750; }
    .metric-value { margin-top: 4px; font-size: clamp(18px, 2vw, 25px); font-weight: 760; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .assumption { color: var(--amber); font-size: 11px; font-weight: 700; margin-top: 2px; }
    .control-band {
      display: flex; align-items: end; justify-content: space-between; gap: 20px;
      padding: 24px 0 16px; border-bottom: 1px solid var(--line);
    }
    .control-band h2 { margin: 0; font-size: 19px; }
    .selector { min-width: min(100%, 390px); }
    label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 11px; text-transform: uppercase; font-weight: 750; }
    select {
      width: 100%; height: 42px; color: var(--ink); background: var(--surface);
      border: 1px solid #adb4ba; border-radius: 6px; padding: 0 36px 0 12px;
    }
    .incident-heading { display: flex; align-items: center; gap: 10px; margin: 20px 0 12px; flex-wrap: wrap; }
    .incident-heading h2 { margin: 0; font-size: 22px; }
    .status {
      display: inline-flex; align-items: center; height: 25px; padding: 0 9px;
      border-radius: 999px; font-size: 11px; font-weight: 760; text-transform: uppercase;
    }
    .status.resolved { color: var(--green); background: var(--green-soft); }
    .status.unresolved { color: var(--amber); background: var(--amber-soft); }
    .timeline-shell {
      overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
      box-shadow: var(--shadow); padding: 20px 18px;
    }
    .timeline {
      min-width: 1080px; height: 286px; display: grid;
      grid-template-columns: repeat(var(--events), minmax(116px, 1fr)); position: relative;
    }
    .timeline::before {
      content: ""; position: absolute; left: 38px; right: 38px; top: 142px;
      height: 2px; background: #b8bec3;
    }
    .event { position: relative; min-width: 0; }
    .event-dot {
      position: absolute; top: 136px; left: calc(50% - 7px); width: 14px; height: 14px;
      border-radius: 50%; border: 3px solid var(--surface); background: var(--blue); z-index: 2;
      box-shadow: 0 0 0 1px var(--blue);
    }
    .event.error .event-dot, .event.alert .event-dot { background: var(--red); box-shadow: 0 0 0 1px var(--red); }
    .event.action .event-dot { background: var(--purple); box-shadow: 0 0 0 1px var(--purple); }
    .event.recovery .event-dot { background: var(--green); box-shadow: 0 0 0 1px var(--green); }
    .event.impact .event-dot { background: var(--amber); box-shadow: 0 0 0 1px var(--amber); }
    .event-content {
      position: absolute; left: 8px; right: 8px; min-height: 90px; padding: 9px;
      border-left: 3px solid var(--blue); background: var(--blue-soft); border-radius: 0 5px 5px 0;
    }
    .event:nth-child(odd) .event-content { bottom: 166px; }
    .event:nth-child(even) .event-content { top: 166px; }
    .event.error .event-content, .event.alert .event-content { border-color: var(--red); background: var(--red-soft); }
    .event.action .event-content { border-color: var(--purple); background: #f3eff9; }
    .event.recovery .event-content { border-color: var(--green); background: var(--green-soft); }
    .event.impact .event-content { border-color: var(--amber); background: var(--amber-soft); }
    .event-time { color: var(--muted); font-size: 10px; font-weight: 760; text-transform: uppercase; }
    .event-label { margin-top: 5px; font-size: 12px; font-weight: 670; overflow-wrap: anywhere; }
    .detail-grid { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(340px, .8fr); gap: 22px; margin-top: 22px; }
    .section { border-top: 3px solid var(--ink); padding-top: 12px; min-width: 0; }
    .section-title { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
    .section h3 { margin: 0; font-size: 15px; text-transform: uppercase; }
    .confidence { display: flex; align-items: center; gap: 9px; font-weight: 750; }
    .confidence-bar { width: 90px; height: 7px; background: #e0e3e5; border-radius: 4px; overflow: hidden; }
    .confidence-bar span { display: block; height: 100%; background: var(--green); }
    .rca { margin: 0; font-size: 18px; line-height: 1.55; }
    .impact-row { display: grid; grid-template-columns: repeat(4, 1fr); margin-top: 18px; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
    .impact-item { padding: 12px; background: var(--surface); border-right: 1px solid var(--line); }
    .impact-item:last-child { border-right: 0; }
    .impact-item span { display: block; color: var(--muted); font-size: 10px; text-transform: uppercase; font-weight: 750; }
    .impact-item strong { display: block; margin-top: 4px; font-size: 15px; overflow-wrap: anywhere; }
    .action-line { padding: 13px 14px; border-left: 4px solid var(--purple); background: #f3eff9; font-size: 16px; font-weight: 720; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 12px; }
    th { color: var(--muted); text-align: left; text-transform: uppercase; font-size: 10px; border-bottom: 1px solid var(--line); padding: 8px 7px; }
    td { vertical-align: top; border-bottom: 1px solid var(--line); padding: 9px 7px; overflow-wrap: anywhere; }
    .empty { padding: 60px 20px; text-align: center; color: var(--muted); }
    @media (max-width: 900px) {
      .brand-row, .control-band { align-items: stretch; flex-direction: column; }
      .live { display: none; }
      .metrics { grid-template-columns: repeat(2, 1fr); }
      .metric { border-bottom: 1px solid var(--line); }
      .metric:nth-child(2n) { border-right: 0; }
      .metric:last-child { grid-column: 1 / -1; border-bottom: 0; }
      .selector { min-width: 0; width: 100%; }
      .detail-grid { grid-template-columns: 1fr; }
      .impact-row { grid-template-columns: repeat(2, 1fr); }
      .impact-item:nth-child(2) { border-right: 0; }
      .impact-item:nth-child(-n+2) { border-bottom: 1px solid var(--line); }
    }
    @media (max-width: 620px) {
      main { padding-inline: 14px; }
      header { padding-inline: 16px; }
      .metrics { grid-template-columns: 1fr 1fr; }
      .metric { padding: 12px; }
      .metric-value { font-size: 17px; }
      .timeline-shell { overflow: visible; padding: 10px 12px; }
      .timeline { min-width: 0; height: auto; display: block; padding: 4px 0; }
      .timeline::before { left: 8px; top: 12px; bottom: 12px; right: auto; width: 2px; height: auto; }
      .event { min-height: 84px; padding-left: 28px; }
      .event-dot { left: 2px; top: 12px; }
      .event-content, .event:nth-child(odd) .event-content, .event:nth-child(even) .event-content {
        position: static; min-height: 0; margin-bottom: 10px;
      }
      .rca { font-size: 16px; }
      .impact-row { grid-template-columns: 1fr; }
      .impact-item { border-right: 0; border-bottom: 1px solid var(--line); }
      .impact-item:last-child { border-bottom: 0; }
      .impact-item:nth-child(2) { border-right: 0; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand-row">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">R</div>
        <div>
          <h1>Payment Incident Investigator</h1>
          <div class="track">Revenue Recovery Commander · AI Revenue Recovery</div>
        </div>
      </div>
      <div class="live">Full synthetic evaluation loaded</div>
    </div>
  </header>
  <main>
    <div id="app"><div class="empty">Loading incident results…</div></div>
  </main>
  <script>
    const app = document.getElementById('app');
    const money = value => new Intl.NumberFormat('en-IN', {
      style: 'currency', currency: 'INR', maximumFractionDigits: 0
    }).format(value);
    const pct = value => `${(value * 100).toFixed(1)}%`;
    const time = value => new Date(value).toLocaleTimeString('en-IN', {
      hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'UTC'
    }) + ' UTC';

    function metric(label, value, assumption = '') {
      return `<div class="metric"><div class="metric-label">${label}</div><div class="metric-value">${value}</div>${assumption ? `<div class="assumption">${assumption}</div>` : ''}</div>`;
    }

    function timeline(events) {
      return `<div class="timeline-shell"><div class="timeline" style="--events:${events.length}">${events.map((event, index) => `
        <div class="event ${event.kind}">
          <div class="event-content"><div class="event-time">${String(index + 1).padStart(2, '0')} · ${time(event.timestamp)}</div><div class="event-label">${event.label}</div></div>
          <span class="event-dot" aria-hidden="true"></span>
        </div>`).join('')}</div></div>`;
    }

    function renderIncident(record) {
      const correlation = record.correlation;
      const impact = record.impact;
      const recovery = record.recovery;
      const resolved = correlation.predicted_cause !== 'unresolved';
      document.getElementById('incident-detail').innerHTML = `
        <div class="incident-heading">
          <h2>${record.incident_id}</h2>
          <span class="status ${resolved ? 'resolved' : 'unresolved'}">${resolved ? correlation.predicted_cause.replaceAll('_', ' ') : 'manual review'}</span>
        </div>
        ${timeline(record.timeline)}
        <div class="detail-grid">
          <section class="section">
            <div class="section-title">
              <h3>Root cause analysis</h3>
              <div class="confidence"><div class="confidence-bar"><span style="width:${correlation.confidence * 100}%"></span></div>${correlation.confidence.toFixed(2)}</div>
            </div>
            <p class="rca">${record.rca_text}</p>
            <div class="impact-row">
              <div class="impact-item"><span>attempted_gmv_inr</span><strong>${money(impact.attempted_gmv_inr)}</strong></div>
              <div class="impact-item"><span>failed_gmv_inr</span><strong>${money(impact.failed_gmv_inr)}</strong></div>
              <div class="impact-item"><span>recoverable_gmv_inr</span><strong>${money(impact.recoverable_gmv_inr)}</strong></div>
              <div class="impact-item"><span>recovered_amount_inr</span><strong>${money(impact.recovered_amount_inr)}</strong><div class="assumption">${(impact.assumed_recovery_success_rate * 100).toFixed(0)}% modeling assumption</div></div>
            </div>
          </section>
          <aside class="section">
            <div class="section-title"><h3>Recovery command</h3></div>
            <div class="action-line">${recovery.primary_action}</div>
            <table>
              <thead><tr><th>Time</th><th>Audit action</th><th>Bounded by</th></tr></thead>
              <tbody>${record.audit_trail.map(entry => `<tr><td>${time(entry.timestamp)}</td><td><strong>${entry.action}</strong><br>${entry.reason}</td><td>${entry.bounded_by}</td></tr>`).join('')}</tbody>
            </table>
          </aside>
        </div>`;
    }

    function render(data) {
      const m = data.aggregate_metrics;
      app.innerHTML = `
        <section class="metrics">
          ${metric('Detection accuracy', pct(m.detection_accuracy))}
          ${metric('Honesty on ambiguity', pct(m.honesty_rate_on_ambiguous_cases))}
          ${metric('Failed GMV', money(m.total_failed_gmv_inr))}
          ${metric('Recoverable GMV', money(m.total_recoverable_gmv_inr))}
          ${metric('Modeled recovered', money(m.total_recovered_amount_inr), `${(data.assumptions.recovery_success_rate * 100).toFixed(0)}% assumption · not measured`)}
        </section>
        <section class="control-band">
          <div><h2>Incident evidence timeline</h2><div class="track">${m.incident_count} incidents · ${m.escalation_count} escalated</div></div>
          <div class="selector"><label for="incident-select">Selected incident</label><select id="incident-select">${data.incidents.map(record => {
            const primary = record.detection.primary_degradation;
            const label = primary ? `${primary.method_display} · ${primary.route}` : 'No detected pair';
            return `<option value="${record.incident_id}">${record.incident_id} — ${label}</option>`;
          }).join('')}</select></div>
        </section>
        <div id="incident-detail"></div>`;
      const select = document.getElementById('incident-select');
      const byId = new Map(data.incidents.map(record => [record.incident_id, record]));
      select.addEventListener('change', () => renderIncident(byId.get(select.value)));
      renderIncident(data.incidents[0]);
    }

    fetch('../results.json')
      .then(response => { if (!response.ok) throw new Error(`HTTP ${response.status}`); return response.json(); })
      .then(render)
      .catch(error => {
        app.innerHTML = `<div class="empty"><strong>Could not load results.json.</strong><br>Serve the repository root with <code>python3 -m http.server 8000</code>, then open <code>/ui/timeline.html</code>.<br><small>${error.message}</small></div>`;
      });
  </script>
</body>
</html>
